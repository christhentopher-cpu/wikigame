services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ./mdsg-server
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MDSG_WIKIDATA_USER_AGENT: mdsg-server/1.0 (https://github.com/christhentopher-cpu/wikigame; Movie Database Search Game)
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  client:
    build: ./mdsg-client
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  redis-data:
